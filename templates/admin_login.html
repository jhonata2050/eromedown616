<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>Autenticação de Segurança | Core Shield</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        body {
            background: 
                radial-gradient(circle at 50% 20%, rgba(56, 189, 248, 0.12) 0%, transparent 50%),
                radial-gradient(circle at 50% 80%, rgba(244, 63, 94, 0.10) 0%, transparent 50%),
                #070a0f !important;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        .login-card {
            background: rgba(18, 24, 38, 0.85);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 20px;
            padding: 45px 35px;
            width: 100%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7), 0 0 40px rgba(56, 189, 248, 0.12);
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .security-badge {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            background: rgba(56, 189, 248, 0.12);
            border: 1px solid rgba(56, 189, 248, 0.35);
            color: #38bdf8;
            padding: 6px 16px;
            border-radius: 50px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 22px;
        }

        .login-title {
            font-size: 24px;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .login-subtitle {
            color: #94a3b8;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 28px;
        }

        .password-field-wrap {
            position: relative;
            display: flex;
            align-items: center;
            width: 100%;
            margin-bottom: 18px;
        }

        .field-icon {
            position: absolute;
            left: 16px;
            font-size: 17px;
            color: #64748b;
            pointer-events: none;
            z-index: 2;
        }

        .password-input {
            width: 100% !important;
            padding: 16px 50px 16px 48px !important;
            background: rgba(10, 14, 23, 0.9) !important;
            border: 2px solid rgba(255, 255, 255, 0.15) !important;
            border-radius: 12px !important;
            color: #ffffff !important;
            font-size: 15px !important;
            outline: none !important;
            transition: all 0.25s ease !important;
            font-family: inherit !important;
            box-sizing: border-box !important;
        }

        /* Força a cor do texto e fundo contra autocomplete branco do Chrome */
        .password-input:-webkit-autofill,
        .password-input:-webkit-autofill:hover, 
        .password-input:-webkit-autofill:focus {
            -webkit-text-fill-color: #ffffff !important;
            -webkit-box-shadow: 0 0 0 1000px #0a0e17 inset !important;
            transition: background-color 5000s ease-in-out 0s !important;
        }

        .password-input:focus {
            border-color: #38bdf8 !important;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.35) !important;
            background: #080c14 !important;
        }

        .toggle-btn {
            position: absolute;
            right: 14px;
            background: transparent;
            border: none;
            color: #94a3b8;
            font-size: 18px;
            cursor: pointer;
            padding: 6px;
            border-radius: 6px;
            transition: color 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
        }

        .toggle-btn:hover {
            color: #38bdf8;
        }

        .login-submit-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(2, 132, 199, 0.4);
            transition: all 0.25s ease;
            font-family: inherit;
        }

        .login-submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(2, 132, 199, 0.55);
        }

        .login-submit-btn:active {
            transform: translateY(0);
        }

        .error-banner {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.35);
            color: #fca5a5;
            padding: 14px;
            border-radius: 10px;
            font-size: 13px;
            line-height: 1.4;
            margin-bottom: 20px;
            text-align: left;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .footer-note {
            margin-top: 25px;
            font-size: 12px;
            color: #64748b;
            line-height: 1.5;
        }

        .footer-note strong {
            color: #94a3b8;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <span class="security-badge">🛡️ Acesso Privado Autenticado</span>
        
        <h1 class="login-title">Painel de <span style="color: #38bdf8;">Gestão</span></h1>
        <p class="login-subtitle">Insira a chave de acesso mestre para desbloquear os controles do site.</p>

        {% if error %}
            <div class="error-banner">
                <span>⚠️</span>
                <span>{{ error }}</span>
            </div>
        {% endif %}

        <form method="POST" action="/sys-auth-verify/{{ current_slug }}" autocomplete="off">
            <div class="password-field-wrap">
                <span class="field-icon">👤</span>
                <input type="text" id="usernameInput" name="username" class="password-input" placeholder="Usuário administrador..." required autofocus autocomplete="username">
            </div>

            <div class="password-field-wrap">
                <span class="field-icon">🔒</span>
                <input type="password" id="passwordInput" name="password" class="password-input" placeholder="Chave de acesso / Senha..." required autocomplete="current-password">
                <button type="button" class="toggle-btn" onclick="togglePassword()" title="Mostrar ou ocultar senha">
                    <span id="eyeIcon">👁️</span>
                </button>
            </div>
            
            <button type="submit" class="login-submit-btn">
                🔓 Autenticar & Entrar
            </button>
        </form>

        <p class="footer-note">
            <small style="color: #64748b;">🔒 Sistema protegido por criptografia de chave dupla. Tentativas inválidas são bloqueadas no firewall.</small>
        </p>
    </div>

    <script>
        function togglePassword() {
            const input = document.getElementById('passwordInput');
            const eye = document.getElementById('eyeIcon');
            if (input.type === 'password') {
                input.type = 'text';
                eye.innerText = '🙈';
            } else {
                input.type = 'password';
                eye.innerText = '👁️';
            }
        }
    </script>
</body>
</html>
