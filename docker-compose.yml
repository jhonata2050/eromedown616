# ==============================================================================
# DOCKER COMPOSE - EROMEDOWN PRODUCTION
# ==============================================================================
# Execução simples em 1 comando:
#   docker compose up -d --build
#
# Para acompanhar os logs:
#   docker compose logs -f
# ==============================================================================

services:
  eromedown:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eromedown_app
    restart: unless-stopped
    ports:
      # Porta no Host:Porta no Container
      # Altere PORT no arquivo .env se quiser rodar na porta 80 ou 8080 diretamente
      - "${PORT:-5000}:5000"
    environment:
      - DATA_DIR=/app/data
      - GUNICORN_BIND=0.0.0.0:5000
      - GUNICORN_WORKERS=${GUNICORN_WORKERS:-4}
      - GUNICORN_THREADS=${GUNICORN_THREADS:-16}
      - GUNICORN_TIMEOUT=${GUNICORN_TIMEOUT:-300}
    volumes:
      # Pasta local ./data no host vinculada à pasta /app/data do container
      # Garante persistência total de estatísticas, anúncios e banco SQLite mesmo após rebuilds
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          # Limite de memória adequado até para VPS básica de 1GB/2GB RAM
          memory: 1536M
